apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/10ajaykumar/travel-booking-gitops.git
    targetRevision: main
    path: charts/gateway-api
    helm:
      releaseName: gateway-api
      valueFiles:
        - ../../environments/prod/gateway-api/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: travel-booking-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
