replicaCount: 3
image:
  repository: 041124309752.dkr.ecr.us-east-1.amazonaws.com/travel-booking-booking-service
  tag: "prod-immutable-placeholder"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
podDisruptionBudget:
  enabled: true
  minAvailable: 2
