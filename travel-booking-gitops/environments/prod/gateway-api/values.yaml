gateway:
  gatewayClassName: gke-l7-global-external-managed
  annotations:
    kubernetes.io/ingress.global-static-ip-name: travel-booking-ip
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: vijaygiduthuri.in
      allowedRoutes:
        namespaces:
          from: Same
httpRoutes:
  enabled: true
  routes:
    - name: frontend-route
      parentRef:
        name: travel-booking-gateway
      hostnames:
        - vijaygiduthuri.in
      path:
        type: PathPrefix
        value: /
      backend:
        name: frontend
        port: 80
    - name: user-service-route
      parentRef:
        name: travel-booking-gateway
      hostnames:
        - vijaygiduthuri.in
      path:
        type: PathPrefix
        value: /api/users
      backend:
        name: user-service
        port: 3001
    - name: search-service-route
      parentRef:
        name: travel-booking-gateway
      hostnames:
        - vijaygiduthuri.in
      path:
        type: PathPrefix
        value: /api/search
      backend:
        name: search-service
        port: 3002
    - name: booking-service-route
      parentRef:
        name: travel-booking-gateway
      hostnames:
        - vijaygiduthuri.in
      path:
        type: PathPrefix
        value: /api/bookings
      backend:
        name: booking-service
        port: 3003
    - name: payment-service-route
      parentRef:
        name: travel-booking-gateway
      hostnames:
        - vijaygiduthuri.in
      path:
        type: PathPrefix
        value: /api/payments
      backend:
        name: payment-service
        port: 3004
    - name: notification-service-route
      parentRef:
        name: travel-booking-gateway
      hostnames:
        - vijaygiduthuri.in
      path:
        type: PathPrefix
        value: /api/notifications
      backend:
        name: notification-service
        port: 3005
