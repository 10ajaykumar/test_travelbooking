{{- if .Values.httpRoutes.enabled }}
{{- range .Values.httpRoutes.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: gateway-api
    app.kubernetes.io/part-of: travel-booking
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ default $.Values.gateway.name .parentRef.name }}
      {{- with .parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
  {{- with .hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .path.type }}
            value: {{ .path.value }}
      backendRefs:
        - name: {{ .backend.name }}
          port: {{ .backend.port }}
{{- end }}
{{- end }}
