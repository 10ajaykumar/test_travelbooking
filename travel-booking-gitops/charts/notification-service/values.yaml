replicaCount: 1
revisionHistoryLimit: 5

image:
  repository: 041124309752.dkr.ecr.us-east-1.amazonaws.com/travel-booking-notification-service
  tag: "replace-me"
  pullPolicy: IfNotPresent

imagePullSecrets: []
containerPort: 3005

service:
  type: ClusterIP
  port: 3005
  targetPort: 3005
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

env:
  PORT: "3005"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: notificationdb
  REDIS_HOST: redis-master
  REDIS_PORT: "6379"
  SMTP_PORT: "587"
  NODE_ENV: production
secretEnv:
  DB_USER:
    name: travel-booking-database
    key: username
  DB_PASSWORD:
    name: travel-booking-database
    key: password
  SMTP_HOST:
    name: travel-booking-smtp
    key: host
    optional: true
  SMTP_USER:
    name: travel-booking-smtp
    key: username
    optional: true
  SMTP_PASS:
    name: travel-booking-smtp
    key: password
    optional: true
envFrom: []
externalSecrets: []

configMap:
  enabled: true
  name: ""

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1
terminationGracePeriodSeconds: 30
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 5
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - protocol: TCP
          port: 3005
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: booking-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
      ports:
        - protocol: TCP
          port: 3005
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to: []
      ports:
        - protocol: TCP
          port: 587

nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
volumes: []
volumeMounts: []
