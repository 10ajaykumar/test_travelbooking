secrets:
  enabled: true
  database:
    name: travel-booking-database
    username: postgres
    password: postgres
  jwt:
    name: travel-booking-jwt
    value: change-me
  smtp:
    name: travel-booking-smtp
    host: ""
    username: ""
    password: ""

postgres:
  enabled: true
  name: postgres
  image: postgres:15-alpine
  imagePullPolicy: IfNotPresent
  service:
    name: postgres
    port: 5432
  database: postgres
  storage:
    size: 5Gi
    storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    fsGroup: 999
  securityContext:
    allowPrivilegeEscalation: false
  initSql: |
    CREATE DATABASE userdb;
    CREATE DATABASE searchdb;
    CREATE DATABASE bookingdb;
    CREATE DATABASE paymentdb;
    CREATE DATABASE notificationdb;

redis:
  enabled: true
  name: redis
  image: redis:7-alpine
  imagePullPolicy: IfNotPresent
  service:
    name: redis-master
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
